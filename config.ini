; DDGACreg additions. The sections above are the DDGUltrawide display settings.

[Input]
; Virtual-key name. Default coin insert is F3.
Coin=F3

[LayoutMode]
; 32:9 uses the arcade ultrawide layout above.
; 16:9 fits a standard widescreen monitor. Each picture keeps its aspect
; (sides are not cropped into the outer quarter).
; single shows one cabinet panel.
; Ctrl+1 left, Ctrl+2 center, Ctrl+3 right, Ctrl+4 touch, Ctrl+0 back to this preset.
; Arrow keys and F4 are not used, so the game and Alt+F4 keep them.
Preset=16:9

[FreeCamera]
; F2 is not a game key. While this is on, WASD / Shift / Ctrl / Space /
; Q / E / R / [ / ] are taken from the game (cheat or cabinet keys). F1, G,
; Enter, and the arrow keys stay with the game. Q and R are in-game cheat
; keys; [ and ] are the cabinet LeftBracket and RightBracket. They still
; reach the game while the free camera is off.
; See docs/process/2026-10-11-game-keys.md.
Enabled=1
Toggle=F2
Faster=SHIFT
Slower=NONE
Up=SPACE
Down=CTRL
; Base speed, unreal units per second. Live speed starts at 10x this, so the
; default 8 behaves as 80. Hold Q to halve the live speed each second, E to
; double it, R to snap back to the 10x base. Shift multiplies the live speed
; while held. Space rises and Ctrl descends. Hold [ to narrow FOV and ] to
; widen it, about 30 degrees per second.
MoveSpeed=8
FastMultiplier=4
SlowMultiplier=0.25
MouseSensitivity=0.15

[Content]
; Local content server only. The NESYS service sends every game API request
; here, whatever NESiCA host the game addressed. Only the port is used.
BaseUrl=http://127.0.0.1:8750
; Read by ddgac-content.exe. UnlockAll=1 releases every mission in every
; difficulty (Professional included) and real mode at NESiCA login, and keeps
; the card's meister points (the shop currency) topped up to 99999.
UnlockAll=1

[Nesys]
; Enabled=1 runs the cabinet's NESYS service inside the game (pipe
; \\.\pipe\nesys_games). It makes the network and the NESiCA button available
; and sends the game's HTTP and card requests to [Content] BaseUrl, so start
; ddgac-content.exe first. Turn it off when another NESYS service is running.
; Trace=1 writes every pipe message both ways to DDGACreg.log (hex head, URLs,
; request and response bodies).
Enabled=1
Trace=1

[Hud]
; While the free camera is on, the hook hides every driving HUD: left, center,
; right, and touch, including fade and now-loading. Enabled=0 makes
; Hud_SetHidden a no-op.
Enabled=1

[Quality]
; Force cinematic sg=4, then lift the cuts @Cine leaves in place: view distance
; 100, motion blur off, HLOD off, shadow distance at the engine max of 2.
; Enabled=0 installs nothing.
Enabled=1

[Route]
; Enabled=1 loads and shows every streaming level of the line once a mission
; world is up (and queues every YMTc section on the Yamanote loop). Releases,
; unloads, and hidden preloads are refused until OutGame loads again. Weather
; and section lighting levels stay with the mission. Enabled=0 installs no
; hook. The mission interval still ends at SectionComponentBase::SectionEnd.
Enabled=1

[Stream]
; Lift the cabinet's per-frame load and streaming caps.
; Enabled=0 leaves those caps alone.
Enabled=1

[Card]
; Keyboard NESiCA reader. The USB reader DLL is not required. On the mode
; select screen the NESiCA mode button stays grey while the game waits for a
; card; press P to tap (a press up to 3 seconds earlier also counts). The card
; is selected on the content server and the button lights up. P is also
; in-game cheat 60; the tap does not swallow it.
; Id must be 16 characters and start with 707 or 709.
Enabled=1
Key=P
Id=7070000000000001
