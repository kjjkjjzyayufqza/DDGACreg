; DDGUltrawide settings. Copy this file next to version.dll
; (TG4AC\Binaries\Win64). Anything left out uses the default shown here.
;
; The game renders its stock 3840x2160 frame exactly as on the cabinet (four
; 1920x1080 screens in a 2x2 grid), and the DLL redraws those screens into its
; own window in the layout below.
;
; DDGUltrawide is MIT licensed (https://github.com/percentcer/DDGUltrawide);
; version.dll includes MinHook, whose license is at the end of this file.

[Output]
; borderless = windowed fullscreen: no title bar, covers the monitor, not topmost.
; windowed = a normal window with a title bar. Width and Height 0 then use
; three quarters of the monitor, centered.
; F11 toggles the two while playing. The game itself stays windowed so its
; frame can be copied; this setting is the window you see.
WindowMode=borderless
; Size of the output window in pixels. 0 = the whole monitor it's on (Width
; and Height both 0: the monitor's resolution) when WindowMode is borderless.
Width=0
Height=0
; Position of the output window's top-left corner on the desktop. With Width
; or Height 0, any point on the monitor to use (0,0 = the main monitor).
X=0
Y=0
; Wait for vertical sync when showing each frame (avoids tearing).
VSync=1
; Snap screen edges to whole pixels (avoids seams between screens).
PixelSnap=1

[Layout]
; 1 = arcade layout: the side screens are drawn smaller than the center, as on
; the cabinet (43" sides, 55" center), with all three sharing a flush bottom
; edge. The center screen is as large as fits. The touch panel goes centered
; under it at a third of the output's height, or in its own window with
; [TouchPanelWindow]. P0..P3 below and [Source] are ignored; the log shows the
; resulting layout.
; 0 = manual layout: each screen goes where P0..P3 and [Source] say.
ArcadeLayout=1
; Arcade layout only: draw the cabinet around the screens instead of black: its
; walls, the frame around each forward screen (rails, seams, fasteners and the Z
; bracket holding it to the wall), the acrylic sheets over the screens (which
; reflect the booth and each other), and the black hood under the center screen
; with the touch panel set into it. The frames touch, as on the cabinet.
; 1 = on, 0 = off.
ArcadeCabinet=1
; The cabinet's wall color, as hex RGB.
ArcadeCabinetColor=BAB3A5
; The cabinet is lit by the game's screens: their light falls on the frames and
; bounces off the booth around the player (walls and ceiling in the cabinet's
; color) back onto the cabinet, tinted by what's on screen. Light is physical:
; ScreenNits is the monitors' white (cd/m^2), shown as display white, and
; RoomLux is the arcade's own lighting falling on the cabinet (0 = none, about
; 100-200 = a dim arcade, 300-500 = a bright one). The brighter the screens
; relative to the room, the darker the cabinet looks next to them.
ArcadeCabinetScreenNits=1000
ArcadeCabinetRoomLux=0
; The booth's two roof LED panels, as bright as this many times the screens'
; white (about 4 for diffused LED panels; 0 = off). They light the booth
; whatever the room's lighting.
ArcadeCabinetRoofLights=0.5
; How soft the roof lights' edges look in reflections, in mm (their diffusers
; glow at the edges). Glossy surfaces blur them more on top of this.
ArcadeCabinetRoofLightGlow=25
; How glossy the hood's black paint is: how far it blurs what it reflects, in
; degrees (0 = a mirror; larger = more satin).
ArcadeCabinetHoodGloss=1.15
; With ArcadeCabinet: the side cabinets' faces turn 55 degrees toward the player,
; as on the real cabinet, and are seen in perspective from where the player
; stands. CameraDistance is how far in front of the center screen that is, in
; mm (the booth's back wall is about 1300 mm away): the closer, the more the
; side screens turn and grow toward their outer edges. 0 = flat (the side
; screens drawn straight on, all in view).
ArcadeCameraDistance=2250
; The perspective view's horizontal field of view, in degrees: smaller zooms in,
; larger zooms out to show more of the side screens. Whatever falls outside it
; is cut off. 0 = the center screen (and the touch panel under it) fills the
; window, as large as without perspective (the log says what field of view
; that is).
ArcadeFov=0
; To try values while playing, see [Hotkeys].
; Arcade layout only: the gap between neighboring forward screens, in inches on
; the cabinet (about 2"), scaled along with the screens. Not used with
; ArcadeCabinet, where the frames set the spacing. 0 = flush.
ArcadeGap=2
; Arcade layout only: with the touch panel in this window (TouchPanelWindow
; off): 1 = let the forward screens use the full width by drawing the touch
; panel over the bottom edge of the center screen.
ArcadeTouchPanelAllowOverlap=0
; Arcade layout only: with the touch panel in this window: the panel's size,
; relative to its normal height (a third of the output). Smaller values leave
; more room for the forward screens (with overlap off) or cover less of the
; center screen (with overlap on). On a 5120x1440 output, the default, 0.75,
; makes the center screen exactly 1920x1080 (the game's own native panel
; resolution) without the cabinet, or 1656x932 with it (the frames take room).
ArcadeTouchPanelScaling=0.75
; Manual layout only:
; Where each screen is drawn in the output: SizeX, SizeY, OriginX, OriginY,
; as fractions of the output. Fractions like 1/3 are allowed.
; P0..P2 = left, center, right window; P3 = touch panel.
; The panel is 1120x480 px, centered below: the matted-off bottom of the panel
; is cropped out in [Source], so the rest is drawn larger (see S3).
P0=1/3, 2/3, 0,    0
P1=1/3, 2/3, 1/3,  0
P2=1/3, 2/3, 2/3,  0
P3=1120/5120, 1/3, 2000/5120, 2/3

[Source]
; Where each screen is in the game's frame (same format and order as [Layout]).
; The cabinet's 2x2 grid: left = top-left, center = top-right,
; right = bottom-left, touch panel = bottom-right.
; The panel's bottom 258 of 1080 rows are covered by a matte on the cabinet, so
; only its top 822 rows are used. To show the whole panel, use
; S3=1/2, 1/2, 1/2, 1/2 with P3=1/6, 1/3, 5/12, 2/3.
S0=1/2, 1/2, 0,   0
S1=1/2, 1/2, 1/2, 0
S2=1/2, 1/2, 0,   1/2
S3=1/2, 822/2160, 1/2, 1/2

[TouchPanelWindow]
; Show the touch panel in its own window, full screen on a separate monitor
; (e.g. a touchscreen), instead of in the main output. P3/S3 above are then
; ignored and the settings below are used. 1 = on, 0 = off.
Enabled=0
; Which monitor: the number Windows shows for it in Settings > Display (the log
; lists every monitor with its number). 0 = the first monitor that isn't
; showing the main output.
Monitor=0
; Or place the window explicitly (desktop pixels); used when Width and Height
; are both set, overriding Monitor.
;X=5120
;Y=0
;Width=1920
;Height=1080
; Wait for vertical sync on this window too. Off by default so the two windows
; don't slow each other down (especially at different refresh rates).
VSync=0
; Where the panel is in the game's frame, and where it is drawn in this window
; (same format as [Source] and [Layout]). By default only the panel's used
; 1920x822 area is drawn (the rest is matted off on the cabinet), as large as
; fits in the window without stretching, centered. Uncomment to override, e.g.
; the whole 1920x1080 panel: Source=1/2, 1/2, 1/2, 1/2. Setting Layout turns off
; the automatic fit (1, 1, 0, 0 fills the window, stretching if needed).
;Source=1/2, 822/2160, 1/2, 1/2
;Layout=1, 1, 0, 0

[Touch]
; Forward mouse clicks on the output window to the game (the game treats mouse
; clicks as touches). 1 = on, 0 = off.
Enabled=1
; Hide the mouse cursor over the output window (e.g. for a real touchscreen).
HideCursor=0

[Hotkeys]
; 1 = while playing, Ctrl+Alt+Up / Down move the perspective camera closer /
; farther by 50 mm, and Ctrl+Alt+Left / Right narrow / widen its field of view
; by 5 degrees (ArcadeCameraDistance, ArcadeFov). The log records each new
; value, to copy into this file. Off by default: some graphics drivers use
; Ctrl+Alt+arrows to rotate the screen.
Enabled=0

[Game]
; Size the game renders at. The DLL sets this (windowed) on the game's command
; line, replacing any resolution already there.
; The frame stays a 2x2 of the four cabinet screens, at whatever size this is.
; The game draws one frame, split into four quarters. The center screen is
; the top-right quarter, so it cannot be a different resolution from the
; other three. Raising the center raises all of them together.
; CenterWidth / CenterHeight are the center screen's pixels. The frame is
; twice that. 2560x1440 is 1:1 on a 2K monitor when Ctrl+2 fills the window.
; Set both to 0 to ignore them.
; ScreenScale multiplies the monitor (FitMonitor=1) or RenderWidth/Height.
; 2 is the same 1:1 result on a 2K screen. It is used only when CenterWidth
; and CenterHeight are 0. Range is 1 to 3.
; FitMonitor=0 and RenderWidth/Height 0, 0 leave the game's size alone.
FitMonitor=1
RenderWidth=3840
RenderHeight=2160
ScreenScale=1
CenterWidth=2560
CenterHeight=1440
; Extra options appended to the game's command line (normally not needed).
ExtraCommandLine=

