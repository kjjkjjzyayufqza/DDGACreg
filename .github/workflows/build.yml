name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject machine-local paths
        shell: pwsh
        run: |
          $needles = @(
            ('C:\' + 'Users'),
            ('C:/' + 'Users'),
            ('/Use' + 'rs/'),
            ('/ho' + 'me/'),
            ('App' + 'Data'),
            ('(2019) ' + '(Japan)')
          )
          $pattern = ($needles -join '|')
          # git grep exits 1 when nothing matches. PowerShell 7 on the runner
          # otherwise turns that into a failed step before this script can read it.
          $PSNativeCommandUseErrorActionPreference = $false
          git grep -n -I -E $pattern -- . ':(exclude)third_party' ':(exclude)server/third_party'
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            throw 'Tracked files contain a machine-local path.'
          }
          if ($code -ne 1) {
            throw "git grep failed while scanning for machine-local paths (exit $code)."
          }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target ddgac ddgac-content

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ddgac-release
          path: |
            build/dll/Release/version.dll
            build/server/Release/ddgac-content.exe
            config.ini
          if-no-files-found: error
