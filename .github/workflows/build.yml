name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject machine-local paths
        shell: bash
        run: |
          set +e
          pattern="$(printf '%s%s|%s%s|%s%s|%s%s|%s%s|%s%s' \
            'C:\' 'Users' \
            'C:/' 'Users' \
            '/Use' 'rs/' \
            '/ho' 'me/' \
            'App' 'Data' \
            '\(2019\) ' '\(Japan\)')"
          git grep -n -I -E "$pattern" -- . ':(exclude)third_party' ':(exclude)server/third_party'
          code=$?
          set -e
          echo "path scan exit ${code}"
          if [ "$code" -eq 0 ]; then
            echo 'Tracked files contain a machine-local path.'
            exit 1
          fi
          if [ "$code" -ne 1 ]; then
            echo "git grep failed (exit ${code})."
            exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target ddgac ddgac-content

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ddgac-release
          path: |
            build/dll/Release/version.dll
            build/server/Release/ddgac-content.exe
            config.ini
          if-no-files-found: error
